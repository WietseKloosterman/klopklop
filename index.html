<style>
/* Eén donker thema: zwart met neonroze. De inhoud van de site zelf staat versleuteld onderaan dit bestand. */
:root {
  color-scheme: dark;
  --bg: #0b070c; --panel: #150f18; --panel-2: #211626; --sunk: #07040a; --line: #3b2743;
  --text: #f6eef5; --muted: #a994ae;
  --accent: #ff2e7e; --on-accent: #1c0410; --bad: #ff6b6b; --ok: #6fcf97; --warn: #f0b45a;
  --r: 14px; --r2: 10px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); padding: 16px 16px 40px; }
[hidden] { display: none !important; }
h1 { font: 700 24px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
button, select, input[type=password] { font: 500 14px/1.2 var(--body); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 13px; }
button { font-weight: 600; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
label.f, div.f { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.alert { border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); border-radius: var(--r2); padding: 10px 12px; font-size: 13.5px; }
.gate { min-height: 80vh; display: grid; place-content: center; }
.gate form { width: min(300px, 100%); display: grid; gap: 18px; }
.gate h1 { font-size: 34px; }
.gate input { width: 100%; font-size: 16px; }
</style>
<style id="appcss"></style>
</head>

</div>

const G = id => document.getElementById(id), b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => [...u].map(b => b.toString(16).padStart(2, "0")).join(""), unhex = s => Uint8Array.from(s.match(/../g), h => parseInt(h, 16));
async function derive(pw) { const e = new TextEncoder(), k = await crypto.subtle.importKey("raw", e.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: e.encode(SALT), iterations: ITER, hash: "SHA-256" }, k, 256)); }
async function dec(key, box) { const k = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, k, b64(box.ct))); }
const mem = { get() { try { return sessionStorage.getItem("klopklop.k"); } catch (e) { return null; } }, set(v) { try { v ? sessionStorage.setItem("klopklop.k", v) : sessionStorage.removeItem("klopklop.k"); } catch (e) {} } };
async function unlock(key, fresh) {
  for (const role of ["user", "admin"]) {
    let ck; try { ck = await dec(key, KEYS[role]); } catch (e) { continue; }
    const p = JSON.parse(new TextDecoder().decode(await dec(ck, BOX)));
    G("appcss").textContent = p.css; G("app").innerHTML = p.html; G("gate").hidden = true; G("app").hidden = false; G("pw").value = "";
    mem.set(hex(key)); new Function("ROLE", "FRESH", "LOCK", p.js)(role, fresh, () => { mem.set(null); location.reload(); });
    return true;
  }
  return false;
}
G("gateForm").addEventListener("submit", async ev => {
  ev.preventDefault(); const err = G("gateErr"); err.hidden = true; G("gateBtn").disabled = true;
  try { if (!await unlock(await derive(G("pw").value), true)) { err.textContent = "Dat wachtwoord klopt niet."; err.hidden = false; G("pw").select(); } }
  catch (e) { err.textContent = "Ontgrendelen lukte niet in deze browser. Open de site via https in een recente browser."; err.hidden = false; }
  G("gateBtn").disabled = false;
});
(async () => { const k = mem.get(); if (k) { try { await unlock(unhex(k), false); } catch (e) {} } })();
